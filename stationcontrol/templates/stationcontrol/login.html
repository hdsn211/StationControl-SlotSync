{% extends 'stationcontrol/base.html' %}
{% load static %}

{% block title %}Login — StationControl{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-sm">

        <!-- Logo -->
        <div class="flex justify-center mt-8 mb-6">
            <img src="{% static 'stationcontrol/logo.png' %}"
                alt="StationControl"
                class="w-40 h-40 rounded-xl object-cover translate-y-6"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

            <!-- Fallback logo -->
            <div class="w-40 h-40 rounded-xl bg-green-600 items-center justify-center"
                style="display:none;">
                <svg class="w-6 h-6 text-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25A2.25 2.25 0 0 1 5.25 3h13.5A2.25 2.25 0 0 1 21 5.25Z" />
                </svg>
            </div>
        </div>

        <!-- Brand -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-900">
                Station<span class="text-green-600">Control</span>
            </h1>
            <p class="mt-1 text-sm text-slate-500">
                Sign in to manage your computer stations
            </p>
        </div>

        <!-- Login Form -->
        <form method="post"
            class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-5">

            {% csrf_token %}

            <div>
                <label for="username"
                    class="block text-xs font-semibold text-slate-600">
                    Username
                </label>

                <input type="text"
                    id="username"
                    name="username"
                    required
                    autofocus
                    autocomplete="username"
                    class="mt-1.5 w-full rounded-xl border border-slate-200
                           px-4 py-3 text-sm text-slate-900
                           placeholder:text-slate-400
                           focus:outline-none
                           focus:ring-4 focus:ring-green-500/10
                           focus:border-green-500">
            </div>

            <div>
                <label for="password"
                    class="block text-xs font-semibold text-slate-600">
                    Password
                </label>

                <input type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    class="mt-1.5 w-full rounded-xl border border-slate-200
                           px-4 py-3 text-sm text-slate-900
                           placeholder:text-slate-400
                           focus:outline-none
                           focus:ring-4 focus:ring-green-500/10
                           focus:border-green-500">
            </div>

            <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700
                       text-white font-semibold text-sm
                       rounded-xl py-3
                       transition
                       focus:outline-none
                       focus:ring-4 focus:ring-green-500/20">
                Sign In
            </button>

        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            StationControl · Admin access only
        </p>

    </div>

</div>

{% endblock %}
