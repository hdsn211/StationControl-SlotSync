{% load l10n %}
<div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
    <p class="font-semibold text-sm">Notifications</p>
    <span class="text-[11px] font-semibold text-green-700 bg-green-100 rounded-full px-2 py-0.5"
          x-data="{ n: {{ events|length }} }" x-text="n + ' recent'">{{ events|length }} recent</span>
</div>
<div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
    {% for e in events %}
    <div class="flex gap-3 px-4 py-3">
        <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0
                    {% if e.action == 'RESERVE' %}bg-green-100 text-green-600
                    {% elif e.action == 'CLAIM' or e.action == 'WALKIN' %}bg-green-50 text-green-700
                    {% elif e.action == 'EXPIRE' %}bg-slate-100 text-slate-500
                    {% elif e.action == 'END' %}bg-green-100 text-green-700
                    {% else %}bg-slate-100 text-slate-500{% endif %}">
            {% if e.action == 'RESERVE' %}
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"/></svg>
            {% elif e.action == 'END' %}
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            {% else %}
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            {% endif %}
        </div>
        <div class="min-w-0">
            <p class="text-sm font-medium text-slate-800">{{ e.message }}</p>
            <p class="text-xs text-slate-400 mt-0.5">{{ e.created_at|timesince }} ago</p>
        </div>
    </div>
    {% empty %}
    <div class="px-4 py-8 text-center text-sm text-slate-400">No activity yet.</div>
    {% endfor %}
</div>
