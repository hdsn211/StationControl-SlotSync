{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SlotSync — Reserve Your PC{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
        }
    </script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-100 font-sans text-slate-900 antialiased min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">

            <!-- Logo + SlotSync grouped together -->
            <div class="flex items-center gap-2">
                <img src="{% static 'slotsync/logo.png' %}" alt="SlotSync" class="w-20 h-20 rounded-xl object-contain"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                <!-- Fallback logo -->
                <div class="w-12 h-12 rounded-xl bg-green-600 items-center justify-center" style="display:none;">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25A2.25 2.25 0 0 1 5.25 3h13.5A2.25 2.25 0 0 1 21 5.25Z" />
                    </svg>
                </div>

                <!-- Brand text -->
                <div>
                    <p class="font-bold leading-none tracking-tight text-lg">
                        Slot<span class="text-green-600">Sync</span>
                    </p>
                    <p class="text-[11px] text-slate-500 mt-1">
                        Computer Café Reservations
                    </p>
                </div>
            </div>

            <!-- Live indicator -->
            <span class="inline-flex items-center gap-1.5 rounded-full bg-green-50 border border-green-200 px-2.5 py-1">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[11px] font-semibold text-green-700">Live</span>
            </span>

        </div>
    </header>
<script>
(function () {
    let version = null;
    async function poll() {
        try {
            const r = await fetch("{% url 'slotsync:events_version' %}?v=" + (version ?? ''), { cache: 'no-store' });
            const data = await r.json();
            if (version !== null && data.version !== version) {
                document.body.dispatchEvent(new CustomEvent('customer-refresh'));
            }
            version = data.version;
        } catch (e) { /* retry below */ }
        setTimeout(poll, 1000);
    }
    poll();
})();
</script>

    {% block content %}{% endblock %}

    <footer class="max-w-md mx-auto px-4 pb-8 pt-2 text-center mt-auto">
        <p class="text-[11px] text-slate-400">No login required · 10-minute hold · Auto-release on no-show</p>
        <p class="text-[11px] text-slate-300 mt-1">SlotSync · Powered by StationControl</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
